resources:
  pipelines:
    weather_medallion_pipeline:
      name: "[${bundle.target}] Weather Medallion Pipeline"
      catalog: ${var.catalog}
      target: medallion
      serverless: true
      root_path: ../src/pipelines/weather_medallion
      configuration:
        landing_volume_path: ${var.landing_volume_path}
        air_quality_landing_volume_path: ${var.air_quality_landing_volume_path}
      libraries:
        - glob:
            include: ../src/pipelines/weather_medallion/transformations/**
