resources:
  pipelines:
    weather_medallion_pipeline:
      name: "[${bundle.target}] Weather Medallion Pipeline"
      catalog: ${var.catalog}
      target: medallion
      serverless: true
      configuration:
        landing_volume_path: ${var.landing_volume_path}
        air_quality_landing_volume_path: ${var.air_quality_landing_volume_path}
      libraries:
        - file:
            path: ../src/pipelines/weather_medallion.py
  
  